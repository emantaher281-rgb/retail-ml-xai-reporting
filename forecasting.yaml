# =============================================================================
# Modules 3 and 4 - Sales Prediction and Daily Forecasting: run configuration
# =============================================================================
seed: 42

# -----------------------------------------------------------------------------
# Module 3: product-level sales prediction
# -----------------------------------------------------------------------------
product_level:
  inputs:
    - "outputs/product_recommendation_dataset.csv"
    - "outputs/seg_customer_profiles.csv"
  cross_validation:
    method: "KFold"
    n_splits: 5
    shuffle: true
    random_state: 42
  models:
    linear_regression:
      hyperparameters: {}          # no tuned parameters
    xgboost:
      fixed:
        random_state: 42
        verbosity: 0
        n_jobs: -1
      search_strategy: "GridSearchCV, scoring=r2"
      search_space:
        n_estimators: [250, 300, 350, 400]
        max_depth: [1, 2, 3, 4]
        learning_rate: [0.01]
      selected: "printed by the notebook as 'Best XGBoost Parameters'"
  outputs:
    - "product_level_forecast.csv"
    - "product_level_customer_summary.csv"
    - "product_forecast_llm.json"

# -----------------------------------------------------------------------------
# Module 4: daily sales forecasting
# -----------------------------------------------------------------------------
daily:
  input: "data/Customer_Segmentation&Sales_Forecasting_Dataset.csv"
  aggregation: "transactions summed to one row per calendar day"

  feature_engineering:
    temporal: ["Year", "Month", "Quarter", "Day_of_Week", "day-of-year", "week-of-year"]
    lags: [1, 2, 3, 7, 14, 30]           # applied to Sales and Quantity
    rolling_windows: [7, 14, 30]         # mean, std, min, max
    ema_spans: [7, 14, 30]
    # Rolling and EMA features are computed on Sales.shift(1) so that the
    # value being predicted never contributes to its own predictor.
    shift_before_rolling: true

  leakage_controls:
    chronological_split: true
    description: >
      The train/test boundary is a date cut-off, not a random sample. Lag,
      rolling and EMA features are built on the ordered series with a one-step
      shift, so no statistic computed on a test-window observation enters a
      training row. Cross-validation uses TimeSeriesSplit, which never places a
      future fold before a past fold.

  cross_validation:
    method: "TimeSeriesSplit"
    n_splits: [3, 5]                     # tscv3 and tscv5
    note: "exact fold boundaries are printed by the notebook"

  models:
    linear_regression: {}
    random_forest:
      search_strategy: "GridSearchCV, cv=TimeSeriesSplit(5), scoring=r2"
      search_space:
        n_estimators: [300]
        max_depth: [15]
      random_state: 42
    xgboost:
      random_state: 42
    stacking_ensemble:
      base_models: ["LinearRegression", "RandomForest", "XGBoost"]
    voting_ensemble:
      base_models: ["LinearRegression", "RandomForest", "XGBoost"]

  metrics: ["R2", "RMSE", "MAE", "MAPE"]

  explainability:
    methods: ["permutation/gain feature importance", "SHAP", "LIME"]
    local_explanation_instance: "Day 0 of the test window"
    cross_method: "Spearman rank correlation between SHAP, LIME and feature importance"

  outputs:
    - "fct_model_comparison.csv"
    - "fct_recent_daily_sales.csv"
    - "fct_model_summary.json"
    - "fct_sales_stats.json"
    - "fct_shap_top_features.json"
